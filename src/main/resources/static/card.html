<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kadi ya QR - Ottoil</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root { --s: .35; --gold: #F7C325; --navy: #0a2f78; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { background: #e9ecef; font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif; }
    .stage { position: relative; width: calc(1024px * var(--s)); height: calc(1536px * var(--s)); margin: 0 auto 40px; box-shadow: 0 4px 16px rgba(0,0,0,.2); }
    .poster { position: absolute; left: 0; top: 0; width: 1024px; height: 1536px; overflow: hidden; background: #fff; color: #111; transform: scale(var(--s)); transform-origin: 0 0; }
    .abs { position: absolute; }

    .top { left: 0; top: 0; width: 100%; height: 330px; background: var(--navy); border-bottom: 10px solid var(--gold); text-align: center; }
    .topimg { left: 0; top: 0; width: 100%; height: 330px; background-size: cover; background-position: center; opacity: .26; }
    .brand { left: 0; top: 92px; width: 100%; text-align: center; font-size: 128px; font-weight: 800; color: #fff; line-height: 1; letter-spacing: 1px; }
    .tagline { left: 0; top: 240px; width: 100%; text-align: center; font-size: 26px; font-weight: 600; color: var(--gold); letter-spacing: 9px; text-transform: uppercase; }

    .welcome { left: 62px; top: 400px; width: 900px; text-align: center; }
    .welcome h1 { font-size: 60px; font-weight: 700; color: var(--navy); line-height: 1.15; }
    .welcome p { margin: 18px 0 0; font-size: 32px; font-weight: 500; color: #333; line-height: 1.45; }

    .qrbox { left: 222px; top: 690px; width: 580px; height: 580px; background: #fff; border: 8px solid var(--gold); border-radius: 18px; display: flex; align-items: center; justify-content: center; }
    .qrbox img { width: 500px; height: 500px; display: block; }

    .rule { left: 62px; top: 1340px; width: 900px; height: 3px; background: var(--gold); }
    .contacts { left: 0; top: 1372px; width: 100%; text-align: center; font-size: 27px; font-weight: 500; color: #000; }
    .contacts b { font-weight: 700; }
    .contacts .sep { margin: 0 24px; color: #888; }
    .bottom { left: 0; bottom: 0; width: 100%; height: 30px; background: var(--navy); border-top: 6px solid var(--gold); }

    @media print {
        :root { --s: .5167 !important; }
        @page { size: A5 portrait; margin: 0; }
        body { background: #fff; }
        .toolbar { display: none !important; }
        .stage { margin: 0 auto; box-shadow: none; }
    }
</style>
</head>
<body>

<div class="toolbar container py-3" style="max-width: 640px;">
    <div class="d-flex flex-wrap gap-2 align-items-center">
        <a href="/admin.html" class="btn btn-sm btn-outline-secondary">Rudi</a>
        <button id="printBtn" class="btn btn-sm btn-primary">Chapisha</button>
        <button id="pngBtn" class="btn btn-sm btn-success">Pakua picha (PNG)</button>
        <span id="status" class="small text-muted">Inapakia...</span>
    </div>
</div>

<div class="stage">
<div class="poster" id="poster">
    <div class="abs top"></div>
    <div class="abs topimg" id="topimg"></div>
    <div class="abs brand">Ottoil</div>
    <div class="abs tagline">Mafuta ya Kupikia</div>

    <div class="abs welcome">
        <h1>Karibu<span id="shop"></span></h1>
        <p>Scan QR code hii kwa simu yako kuagiza mafuta ya kupikia. Tutakupigia kuthibitisha oda yako.</p>
    </div>

    <div class="abs qrbox"><img id="qr" alt="QR"></div>

    <div class="abs rule"></div>
    <div class="abs contacts">
        <b>Simu:</b> +255 621 344 447<span class="sep">|</span><b>WhatsApp:</b> +255 782 005 482
    </div>
    <div class="abs bottom"></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const root = document.documentElement;
let shopName = 'mteja';

function fit() {
    const w = Math.min(window.innerWidth - 24, 640);
    root.style.setProperty('--s', (w / 1024).toFixed(4));
}
fit();
window.addEventListener('resize', fit);

$('printBtn').onclick = () => window.print();

$('pngBtn').onclick = async () => {
    const old = root.style.getPropertyValue('--s');
    $('status').textContent = 'Inatengeneza picha...';
    window.scrollTo(0, 0);
    root.style.setProperty('--s', '1');
    try {
        await document.fonts.ready;
        await new Promise(r => setTimeout(r, 100));
        const canvas = await html2canvas($('poster'), { scale: 2, backgroundColor: '#ffffff', useCORS: true });
        canvas.toBlob(b => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(b);
            a.download = 'ottoil-' + shopName.replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '.png';
            a.click();
        }, 'image/png');
        $('status').textContent = 'Imepakuliwa';
    } catch (e) {
        $('status').textContent = 'Imeshindikana, tumia Chapisha > Save as PDF';
    }
    root.style.setProperty('--s', old);
};

async function loadTopImage() {
    try {
        const list = await (await fetch('/api/public/backgrounds')).json();
        if (!list.length) return;
        const url = list[Math.floor(Math.random() * list.length)];
        await new Promise(res => { const im = new Image(); im.onload = res; im.onerror = res; im.src = url; });
        $('topimg').style.backgroundImage = 'url("' + url + '")';
    } catch (e) { /* hakuna picha, band inabaki ya bluu */ }
}

(async function init() {
    const id = new URLSearchParams(location.search).get('id');
    const jwt = localStorage.getItem('jwt');
    if (!id || !jwt) return location.replace('/admin.html');
    const headers = { Authorization: 'Bearer ' + jwt };
    try {
        const [qr, list] = await Promise.all([
            fetch('/api/admin/customers/' + encodeURIComponent(id) + '/qr', { headers }),
            fetch('/api/admin/customers', { headers })
        ]);
        if ([qr.status, list.status].some(s => s === 401 || s === 403)) return location.replace('/admin.html');
        if (!qr.ok) throw new Error('qr');
        $('qr').src = URL.createObjectURL(await qr.blob());
        await $('qr').decode().catch(() => {});
        const c = (await list.json()).find(x => String(x.id) === id);
        if (c) { shopName = c.name; $('shop').textContent = ', ' + c.name; }
        await loadTopImage();
        $('status').textContent = 'Tayari';
    } catch (e) {
        $('status').textContent = 'Imeshindwa kupakia QR';
    }
})();
</script>
</body>
</html>
