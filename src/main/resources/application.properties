spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/oilorders}
spring.datasource.username=${DB_USER:michael}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Dar_es_Salaam
server.port=${PORT:8082}


app.notify.email=${NOTIFY_EMAIL:your@gmail.com}
app.resend.key=${RESEND_API_KEY:}
app.base-url=${BASE_URL:http://localhost:8082}
app.admin.username=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD:local-admin-change-me}
app.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-at-least-32-chars}
